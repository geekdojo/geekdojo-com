<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }} — geekdojo</title>
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:title" content="{{ .Title }} — geekdojo">
<meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ if .IsPage }}<meta property="article:published_time" content="{{ .Date.Format "2006-01-02" }}">{{ end }}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="me" href="https://hachyderm.io/@hoodoo5x5">
<link rel="alternate" type="application/rss+xml" title="Developing with AI — geekdojo" href="https://geekdojo.com/developing-with-ai/index.xml">
<link rel="stylesheet" href="/styles.css">
<script data-goatcounter="https://geekdojo.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="site-head">
  <nav class="wrap">
    <a class="brand" href="/">
      <img class="mark" src="/logo-icon.png" alt="" width="22" height="22">
      GEEKDOJO
    </a>
    <div class="nav-links">
      <a href="/#rasputin">Rasputin</a>
      <a href="/developing-with-ai/">Developing with AI</a>
      <a href="/about/">About</a>
      <a href="https://github.com/geekdojo">GitHub</a>
    </div>
  </nav>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer class="site-foot">
  <div class="wrap foot-fine">
    <p class="muted">© 2026 geekdojo. Site content
    <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC-BY-SA-4.0</a>;
    our software is licensed in its own repos (Rasputin is AGPL-3.0).</p>
  </div>
</footer>
</body>
</html>
